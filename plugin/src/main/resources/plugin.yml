name: BitsCraftPlugin
version: ${version}
main: dev.jamon.bitscraft.BitsCraftPlugin
api-version: '1.21'
author: jam0ncit0
description: Conecta los canales de Twitch y los directos de TikTok de los streamers con su partida.
softdepend: [WorldGuard, GriefPrevention]
commands:
  bits:
    description: Vincular tu canal de Twitch y tu directo de TikTok, y controlar lo que te pasa en el juego.
    usage: /bits [vincular|desvincular|estado|pausa|reanudar|tiktok|probar|vaciar|recargar]
    aliases: [twitch]
    permission: bitscraft.streamer
permissions:
  bitscraft.streamer:
    description: Vincular un canal de Twitch o un directo de TikTok y recibir sus eventos en el juego.
    default: op
  bitscraft.admin:
    description: Probar eventos, pausar o vaciar la fila de otros streamers y recargar la configuración.
    default: op
    children:
      bitscraft.streamer: true
